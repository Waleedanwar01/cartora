<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartora</title><link rel="stylesheet" href="/static/importer/app.css"></head><body><header><a href="/" class="logo"><span>◈</span> Cartora</a><small>Catalog importer</small></header><main><div class="hero"><p>PRODUCT IMPORT</p><h1>Import with control.</h1><span>Fetch, inspect, export.</span></div><form id="f">{% csrf_token %}<div class="steps"><aside><b>1</b>Source<b>2</b>Fields<b>3</b>Export</aside><section class="card"><h2>1. Source</h2><div class="mode"><label><input checked type="radio" name="mode" value="product">Product</label><label><input type="radio" name="mode" value="collection">Collection</label></div><label>Source URL<input name="url" type="url" required placeholder="https://store.com/shop/product"></label></section><section class="card"><h2>2. Data to fetch</h2><div class="checks" id="fields"><label><input checked value="Body (HTML)" data-w="Description" type="checkbox">Description</label><label><input checked value="Image Src" data-w="Images" type="checkbox">All images</label><label><input checked value="Vendor" data-w="Meta: _vendor" type="checkbox">Vendor</label><label><input checked value="Variant SKU" data-w="SKU" type="checkbox">SKU</label><label><input checked value="Variant Price|Variant Compare At Price" data-w="Regular price|Sale price" type="checkbox">Price / old</label><label><input checked value="Tags" data-w="Tags" type="checkbox">Tags</label><label><input checked value="Type" data-w="Categories" type="checkbox">Category</label><label><input checked value="SEO Title|SEO Description" data-w="Meta: yoast_wpseo_title|Meta: yoast_wpseo_metadesc" type="checkbox">SEO data</label><label><input checked value="Option1 Name|Option1 Value|Option2 Name|Option2 Value|Option3 Name|Option3 Value" data-w="Attribute 1 name|Attribute 1 value(s)" type="checkbox">Variants / size / color</label></div></section><section class="card"><h2>3. Export</h2><div class="mode"><label><input checked type="radio" name="platform" value="shopify">Shopify CSV</label><label><input type="radio" name="platform" value="woocommerce">WooCommerce CSV</label></div><button id="fetch">Fetch & preview</button></section></div></form><section id="review" hidden><div class="review-title"><div><p>REVIEW RESULTS</p><h2>Fetched products</h2><span id="sum"></span></div><button id="download">Download CSV</button></div><div class="table"><table><thead><tr><th>Product</th><th>Description</th><th>Price</th><th>SKU</th><th>Tags</th><th>Images</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><aside id="drawer"><button id="close">×</button><div id="detail"></div></aside><div id="shade"></div><footer>Cartora · Review first, export second.</footer><script>const f=document.querySelector('#f'),t=f.querySelector('[name=csrfmiddlewaretoken]').value;let ps=[];const e=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));f.onsubmit=async x=>{x.preventDefault();try{let r=await fetch('/preview/',{method:'POST',headers:{'X-CSRFToken':t},body:new FormData(f)}),d=await r.json();if(d.error)throw Error(d.error);ps=d.products||[];sum.textContent=ps.length+' product(s) fetched';rows.innerHTML=ps.map((p,i)=>`<tr data-i="${i}"><td><img src="${e(p.images?.[0])}"><b>${e(p.title)}</b></td><td class="desc">${e(p.description||'—')}</td><td>${e(p.price||'—')}</td><td>${e(p.sku||'—')}</td><td>${e(p.tags||'—')}</td><td>${p.images?.length||0}</td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(r=>r.onclick=()=>show(ps[r.dataset.i]));review.hidden=false}catch(err){alert(err.message)}};function show(p){detail.innerHTML=`<p>PRODUCT INSPECTOR</p><h2>${e(p.title)}</h2><h3>Description</h3><p class="description">${e(p.description||'—')}</p><h3>Data</h3><dl>${[['SKU',p.sku],['Vendor',p.vendor],['Category',p.categories],['Tags',p.tags],['SEO title',p.seo_title],['SEO description',p.seo_description]].map(x=>`<div><dt>${x[0]}</dt><dd>${e(x[1]||'—')}</dd></div>`).join('')}</dl><h3>Images</h3><div class="gallery">${(p.images||[]).map(u=>`<figure><img src="${e(u)}"></figure>`).join('')}</div><h3>Variants</h3>${(p.variants||[]).map(v=>`<article class="variant"><b>${e(v.title)}</b><span>${e(Object.entries(v.options||{}).map(x=>x.join(': ')).join(' · '))}</span></article>`).join('')||'—'}`;drawer.classList.add('open');shade.classList.add('open')}close.onclick=()=>{drawer.classList.remove('open');shade.classList.remove('open')};shade.onclick=close.onclick;download.onclick=()=>{let p=f.platform.value,fs=[...fields.querySelectorAll(':checked')].flatMap(i=>(p==='shopify'?i.value:i.dataset.w).split('|')),q=document.createElement('form');q.method='POST';q.action='/export/'+p+'/';q.innerHTML='<input name="csrfmiddlewaretoken"><input name="products"><input name="fields">';q.querySelector('[name=csrfmiddlewaretoken]').value=t;q.querySelector('[name=products]').value=JSON.stringify(ps);q.querySelector('[name=fields]').value=JSON.stringify(fs);document.body.append(q);q.submit()};</script></body></html>
